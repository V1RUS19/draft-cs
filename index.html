<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 Draft BO3 — Firebase</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== Все стили (без изменений) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0d10;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2a 0%, #0b0d10 70%);
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 22, 30, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 32px 36px 40px;
            border: 1px solid rgba(255, 180, 50, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        .title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7c948, #f0a020);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #8a92a8; font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
        .phase-badge {
            display: inline-block;
            background: rgba(247, 201, 72, 0.12);
            color: #f7c948;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(247, 201, 72, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header-left { display: flex; flex-direction: column; gap: 4px; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .team-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .team-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .team-input-group:focus-within { border-color: rgba(247, 201, 72, 0.3); }
        .team-input-group .label { font-weight: 600; font-size: 13px; color: #8a92a8; letter-spacing: 0.5px; }
        .team-input-group .label.a { color: #ff6b6b; }
        .team-input-group .label.b { color: #4ecdc4; }
        .team-input-group input {
            background: transparent;
            border: none;
            color: #e8ecf5;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 4px;
            width: 110px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .btn {
            background: linear-gradient(135deg, #f7c948, #e8a020);
            border: none;
            color: #0b0d10;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 20px rgba(247, 201, 72, 0.2);
            white-space: nowrap;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(247, 201, 72, 0.35); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8a92a8;
            font-weight: 500;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #e8ecf5; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 14px 22px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .status-turn {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #e8ecf5;
        }
        .status-turn .team-indicator {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
        }
        .team-indicator.a { background: rgba(255, 107, 107, 0.18); color: #ff6b6b; }
        .team-indicator.b { background: rgba(78, 205, 196, 0.18); color: #4ecdc4; }
        .status-action { color: #aab2c8; font-size: 14px; font-weight: 500; }
        .fb-status {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 8px 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .fb-status .label { color: #8a92a8; font-size: 13px; font-weight: 500; }
        .fb-status .status { font-size: 14px; font-weight: 600; }
        .fb-status .status.connected { color: #4ecdc4; }
        .fb-status .status.disconnected { color: #ff6b6b; }
        .fb-status .status.connecting { color: #f7c948; }
        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .map-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px 10px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            user-select: none;
        }
        .map-card:hover:not(.banned):not(.picked):not(.disabled) {
            border-color: rgba(247, 201, 72, 0.25);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
        }
        .map-card .map-icon { font-size: 34px; display: block; margin-bottom: 6px; }
        .map-card .map-name { font-weight: 600; font-size: 14px; color: #e8ecf5; }
        .map-card .map-status {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
        }
        .map-card .map-status.available { color: #5a6a8a; background: rgba(255,255,255,0.03); }
        .map-card .map-status.banned { color: #ff6b6b; background: rgba(255,107,107,0.12); }
        .map-card .map-status.picked { color: #4ecdc4; background: rgba(78,205,196,0.12); }
        .map-card .map-status.remaining { color: #f7c948; background: rgba(247,201,72,0.15); }
        .map-card.banned { opacity: 0.4; cursor: not-allowed; border-color: rgba(255,107,107,0.1); }
        .map-card.picked { opacity: 0.7; cursor: not-allowed; }
        .map-card.disabled { cursor: not-allowed; opacity: 0.5; }
        .map-card.clickable { cursor: pointer; }
        .map-card .pick-order {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f7c948;
            color: #0b0d10;
            font-weight: 700;
            font-size: 11px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-card .pick-order.ct { background: #4ecdc4; }
        .map-card .pick-order.t { background: #ff6b6b; }
        .results {
            margin-top: 16px;
            padding: 22px 28px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            border: 1px solid rgba(247,201,72,0.08);
            display: none;
        }
        .results.visible { display: block; animation: fadeSlide 0.5s ease; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .results .result-title { font-family: 'Orbitron', monospace; font-weight: 700; font-size: 20px; color: #f7c948; margin-bottom: 12px; }
        .results .result-grid { display: flex; flex-wrap: wrap; gap: 20px 40px; }
        .results .result-item { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #e8ecf5; font-weight: 500; }
        .results .result-item .side-label {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            background: rgba(255,255,255,0.06);
            color: #8a92a8;
        }
        .results .result-item .side-label.ct { background: rgba(78,205,196,0.12); color: #4ecdc4; }
        .results .result-item .side-label.t { background: rgba(255,107,107,0.12); color: #ff6b6b; }
        .history {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            max-height: 80px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .history .entry { font-size: 13px; color: #6a728a; }
        .history .entry strong { color: #aab2c8; }
        .history .entry .hl-a { color: #ff6b6b; }
        .history .entry .hl-b { color: #4ecdc4; }
        .history .entry .hl-gold { color: #f7c948; }
        .hidden { display: none !important; }
        .side-pick-widget {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0,0,0,0.3);
            padding: 6px 18px 6px 22px;
            border-radius: 40px;
            border: 1px solid rgba(247,201,72,0.12);
        }
        .side-pick-widget .label { font-size: 13px; font-weight: 500; color: #8a92a8; }
        .side-pick-widget .winner { font-weight: 700; font-size: 14px; color: #f7c948; }
        .side-pick-widget .btn-side {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e8ecf5;
            font-weight: 600;
            font-size: 13px;
            padding: 5px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-pick-widget .btn-side.ct { color: #4ecdc4; }
        .side-pick-widget .btn-side.t { color: #ff6b6b; }
        .side-pick-widget .btn-side.chosen {
            background: rgba(247,201,72,0.15);
            border-color: #f7c948;
            color: #f7c948;
        }
        @media (max-width: 760px) {
            .app { padding: 20px 18px 28px; }
            .header { flex-direction: column; align-items: stretch; }
            .header-right { flex-direction: column; align-items: stretch; }
            .team-inputs { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; justify-content: center; }
            .fb-status { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="header">
        <div class="header-left">
            <span class="title">⚔️ CS2 DRAFT</span>
            <span class="subtitle">BO3 · Firebase</span>
        </div>
        <div class="header-right">
            <div class="team-inputs">
                <div class="team-input-group">
                    <span class="label a">▲ A</span>
                    <input type="text" id="teamAInput" placeholder="Команда А" value="Team A" />
                </div>
                <div class="team-input-group">
                    <span class="label b">▼ B</span>
                    <input type="text" id="teamBInput" placeholder="Команда Б" value="Team B" />
                </div>
                <button class="btn" id="btnStart" disabled>▶ Начать драфт</button>
            </div>
            <button class="btn-secondary" id="btnReset">⟲ Сброс</button>
        </div>
    </div>

    <!-- Статус Firebase -->
    <div class="fb-status">
        <span class="label">🔗 Firebase:</span>
        <span class="status" id="fbStatus">Подключение...</span>
        <button class="btn-secondary" id="btnReconnect">🔄 Переподключиться</button>
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar" id="statusBar">
        <div class="status-left">
            <div class="status-turn" id="statusTurn">
                <span class="phase-badge" id="phaseBadge">⚡ Ожидание</span>
                <span id="turnDisplay" style="color:#6a728a;font-weight:400;">—</span>
            </div>
            <div class="status-action" id="statusAction">
                Введите названия команд и нажмите «Начать драфт»
            </div>
        </div>
        <div id="sidePickContainer" class="side-pick-widget hidden">
            <span class="label">🎯 Выбор стороны</span>
            <span class="winner" id="sideWinner">—</span>
            <button class="btn-side ct" data-side="CT">CT</button>
            <button class="btn-side t" data-side="T">T</button>
        </div>
    </div>

    <!-- MAP GRID -->
    <div class="map-grid" id="mapGrid"></div>

    <!-- RESULTS -->
    <div class="results" id="results">
        <div class="result-title">🏆 Результат драфта</div>
        <div class="result-grid" id="resultGrid"></div>
        <div class="history" id="historyLog"></div>
    </div>
</div>

<script>
    // ============================================================
    // 🔥 КОНФИГУРАЦИЯ FIREBASE (ваша, уже вставлена)
    const firebaseConfig = {
        apiKey: "AIzaSyDeyrzmA7qQIhGQYeL51WAlgiKQsXE0c1c",
        authDomain: "draft-cs22.firebaseapp.com",
        databaseURL: "https://draft-cs22-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "draft-cs22",
        storageBucket: "draft-cs22.firebasestorage.app",
        messagingSenderId: "421775366894",
        appId: "1:421775366894:web:a68c37c075540676cd31ff",
        measurementId: "G-7RDLE4P9XS"
    };
    // ============================================================

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('draft');

    let isConnected = false;
    let ignoreNextSnapshot = false;
    const fbStatus = document.getElementById('fbStatus');

    // ============================================================
    // 1. MAPS
    const MAPS_DATA = [
        { id: 'dust2', name: 'Dust II', icon: '🏜️' },
        { id: 'mirage', name: 'Mirage', icon: '🏗️' },
        { id: 'inferno', name: 'Inferno', icon: '🏛️' },
        { id: 'nuke', name: 'Nuke', icon: '🏭' },
        { id: 'vertigo', name: 'Vertigo', icon: '🗻' },
        { id: 'ancient', name: 'Ancient', icon: '🏺' },
        { id: 'anubis', name: 'Anubis', icon: '🌊' },
    ];

    // ============================================================
    // 2. STATE
    const state = {
        teamA: 'Team A',
        teamB: 'Team B',
        startingTeam: null,
        currentTurn: null,
        phase: 'setup',
        maps: MAPS_DATA.map(m => ({ ...m, status: 'available' })),
        picked: [],
        banned: [],
        history: [],
        banOrder: 0,
        pickOrder: 0,
        isLocked: false,
        sidePickMapId: null,
        sidePickWinner: null,
        sidePickChoice: null,
    };

    // ============================================================
    // 3. DOM refs
    const $ = id => document.getElementById(id);
    const teamAInput = $('teamAInput');
    const teamBInput = $('teamBInput');
    const btnStart = $('btnStart');
    const btnReset = $('btnReset');
    const mapGrid = $('mapGrid');
    const phaseBadge = $('phaseBadge');
    const turnDisplay = $('turnDisplay');
    const statusAction = $('statusAction');
    const sidePickContainer = $('sidePickContainer');
    const sideWinner = $('sideWinner');
    const resultsDiv = $('results');
    const resultGrid = $('resultGrid');
    const historyLog = $('historyLog');
    const btnReconnect = $('btnReconnect');

    // ============================================================
    // 4. Работа с Firebase
    function saveStateToFirebase() {
        // Даже если isConnected false, пытаемся сохранить (для первого раза)
        const data = {
            teamA: state.teamA,
            teamB: state.teamB,
            startingTeam: state.startingTeam,
            currentTurn: state.currentTurn,
            phase: state.phase,
            maps: state.maps,
            picked: state.picked,
            banned: state.banned,
            history: state.history,
            banOrder: state.banOrder,
            pickOrder: state.pickOrder,
            isLocked: state.isLocked,
            sidePickMapId: state.sidePickMapId,
            sidePickWinner: state.sidePickWinner,
            sidePickChoice: state.sidePickChoice,
        };
        dbRef.set(data)
            .then(() => console.log('Данные сохранены'))
            .catch(err => console.error('Ошибка сохранения:', err));
    }

    function loadStateFromFirebase() {
        dbRef.on('value', (snapshot) => {
            // Сразу считаем, что соединение установлено
            isConnected = true;
            fbStatus.textContent = 'Синхронизировано';
            fbStatus.className = 'status connected';
            btnStart.disabled = !(state.phase === 'setup' && isConnected);

            const data = snapshot.val();
            if (!data) {
                // Если данных нет, создаём начальное состояние
                fbStatus.textContent = 'Создание данных...';
                ignoreNextSnapshot = true;
                saveStateToFirebase();
                return;
            }
            if (ignoreNextSnapshot) {
                ignoreNextSnapshot = false;
                return;
            }
            applyRemoteState(data);
        }, (error) => {
            console.error('Ошибка чтения Firebase:', error);
            fbStatus.textContent = 'Ошибка подключения';
            fbStatus.className = 'status disconnected';
            isConnected = false;
            btnStart.disabled = true;
        });
    }

    function applyRemoteState(data) {
        Object.assign(state, data);
        teamAInput.value = state.teamA;
        teamBInput.value = state.teamB;
        renderAll();
        if (state.phase === 'complete') resultsDiv.classList.add('visible');
        else resultsDiv.classList.remove('visible');
        btnStart.disabled = !(state.phase === 'setup' && isConnected);
    }

    function sendAction(actionPayload) {
        if (!isConnected) {
            alert('Нет соединения с Firebase');
            return;
        }
        applyAction(actionPayload);
        ignoreNextSnapshot = true;
        saveStateToFirebase();
    }

    // ============================================================
    // 5. Вспомогательные функции
    function getTeamName(team) { return team === 'A' ? state.teamA : state.teamB; }
    function getTeamClass(team) { return team === 'A' ? 'a' : 'b'; }
    function getTeamColor(team) { return team === 'A' ? '#ff6b6b' : '#4ecdc4'; }
    function getOpponent(team) { return team === 'A' ? 'B' : 'A'; }
    function getAvailableMaps() { return state.maps.filter(m => m.status === 'available'); }
    function getMapById(id) { return state.maps.find(m => m.id === id); }
    function getPickedMap(order) { return state.picked.find(p => p.order === order); }
    function addHistory(text) { state.history.push({ text }); renderHistory(); }

    // ============================================================
    // 6. Отрисовка
    function renderMaps() {
        mapGrid.innerHTML = '';
        state.maps.forEach((map) => {
            const card = document.createElement('div');
            card.className = 'map-card';
            if (map.status === 'banned') card.classList.add('banned');
            if (map.status === 'picked') card.classList.add('picked');
            const isClickable = map.status === 'available' &&
                (state.phase === 'ban1' || state.phase === 'ban2' || state.phase === 'ban3' || state.phase === 'ban4' ||
                    state.phase === 'pick1' || state.phase === 'pick2') &&
                !state.isLocked && isConnected;
            if (isClickable) card.classList.add('clickable');
            else card.classList.add('disabled');

            const icon = document.createElement('span');
            icon.className = 'map-icon';
            icon.textContent = map.icon;
            card.appendChild(icon);

            const name = document.createElement('div');
            name.className = 'map-name';
            name.textContent = map.name;
            card.appendChild(name);

            const status = document.createElement('span');
            status.className = 'map-status ' + map.status;
            const labels = { available: 'Доступна', banned: 'Забанена', picked: 'Выбрана', remaining: 'Осталась' };
            status.textContent = labels[map.status] || map.status;
            card.appendChild(status);

            if (map.status === 'picked') {
                const pick = state.picked.find(p => p.mapId === map.id);
                if (pick) {
                    const badge = document.createElement('span');
                    badge.className = 'pick-order';
                    if (pick.side === 'CT') badge.classList.add('ct');
                    else if (pick.side === 'T') badge.classList.add('t');
                    badge.textContent = pick.order;
                    card.appendChild(badge);
                }
            }

            card.addEventListener('click', () => {
                if (map.status === 'available' && !state.isLocked && isConnected &&
                    (state.phase === 'ban1' || state.phase === 'ban2' || state.phase === 'ban3' || state.phase === 'ban4' ||
                        state.phase === 'pick1' || state.phase === 'pick2')) {
                    handleMapClick(map.id);
                }
            });

            mapGrid.appendChild(card);
        });
    }

    function renderStatus() {
        const phaseLabels = {
            setup: '⚡ Ожидание',
            start_announce: '🎲 Жеребьёвка',
            ban1: '🚫 Бан #1',
            ban2: '🚫 Бан #2',
            pick1: '📌 Выбор 1-й карты',
            side_pick1: '🎯 Сторона для 1-й карты',
            ban3: '🚫 Бан #3',
            ban4: '🚫 Бан #4',
            pick2: '📌 Выбор 2-й карты',
            side_pick2: '🎯 Сторона для 2-й карты',
            complete: '🏆 Драфт завершён!',
        };
        phaseBadge.textContent = phaseLabels[state.phase] || state.phase;

        if (state.phase === 'setup') {
            turnDisplay.textContent = '—';
            statusAction.textContent = 'Введите названия команд и нажмите «Начать драфт»';
            sidePickContainer.classList.add('hidden');
            return;
        }
        if (state.phase === 'start_announce') {
            const starter = state.startingTeam;
            turnDisplay.innerHTML = `<span class="team-indicator ${getTeamClass(starter)}">${getTeamName(starter)}</span> начинает драфт`;
            statusAction.textContent = 'Первая команда банит карту...';
            sidePickContainer.classList.add('hidden');
            return;
        }
        if (state.phase === 'complete') {
            turnDisplay.textContent = '✅ Завершено';
            statusAction.textContent = 'Драфт окончен. Смотрите результаты.';
            sidePickContainer.classList.add('hidden');
            return;
        }
        if (state.currentTurn) {
            const team = state.currentTurn;
            const name = getTeamName(team);
            const actionMap = {
                ban1: 'банит карту',
                ban2: 'банит карту',
                pick1: 'выбирает 1-ю карту',
                ban3: 'банит карту',
                ban4: 'банит карту',
                pick2: 'выбирает 2-ю карту',
            };
            const action = actionMap[state.phase] || 'ходит';
            turnDisplay.innerHTML = `<span class="team-indicator ${getTeamClass(team)}">${name}</span> ${action}`;
            statusAction.textContent = `Нажмите на карту, чтобы ${action === 'банит карту' ? 'забанить' : 'выбрать'}.`;
            sidePickContainer.classList.add('hidden');
        } else if (state.phase === 'side_pick1' || state.phase === 'side_pick2') {
            const team = state.sidePickWinner;
            if (team) {
                turnDisplay.innerHTML = `<span class="team-indicator ${getTeamClass(team)}">${getTeamName(team)}</span> выбирает сторону`;
                statusAction.textContent = `Выберите сторону (CT или T) для карты ${getMapById(state.sidePickMapId)?.name || ''}`;
            }
            sidePickContainer.classList.remove('hidden');
            sideWinner.textContent = getTeamName(team);
            sideWinner.style.color = '#f7c948';
            document.querySelectorAll('.btn-side').forEach(btn => {
                btn.classList.remove('chosen');
                if (state.sidePickChoice && btn.dataset.side === state.sidePickChoice) {
                    btn.classList.add('chosen');
                }
                btn.disabled = !!state.sidePickChoice || state.isLocked || !isConnected;
                btn.style.opacity = btn.disabled ? '0.4' : '1';
            });
        } else {
            sidePickContainer.classList.add('hidden');
        }
    }

    function renderResults() {
        if (state.phase !== 'complete') {
            resultsDiv.classList.remove('visible');
            return;
        }
        resultsDiv.classList.add('visible');
        const pick1 = getPickedMap(1);
        const pick2 = getPickedMap(2);
        const remaining = getAvailableMaps()[0];
        let html = '';
        if (pick1) {
            const team = getTeamName(pick1.team);
            const side = pick1.side || '—';
            html += `
                <div class="result-item">
                    <span class="num">#1</span>
                    <span class="map-name">${pick1.mapId}</span>
                    <span style="color:${getTeamColor(pick1.team)}">${team}</span>
                    <span class="side-label ${side === 'CT' ? 'ct' : side === 'T' ? 't' : ''}">${side}</span>
                </div>
            `;
        }
        if (pick2) {
            const team = getTeamName(pick2.team);
            const side = pick2.side || '—';
            html += `
                <div class="result-item">
                    <span class="num">#2</span>
                    <span class="map-name">${pick2.mapId}</span>
                    <span style="color:${getTeamColor(pick2.team)}">${team}</span>
                    <span class="side-label ${side === 'CT' ? 'ct' : side === 'T' ? 't' : ''}">${side}</span>
                </div>
            `;
        }
        if (remaining) {
            html += `
                <div class="result-item">
                    <span class="num">#3</span>
                    <span class="map-name" style="color:#f7c948;font-weight:700;">${remaining.icon} ${remaining.name}</span>
                    <span style="color:#8a92a8;">(осталась)</span>
                </div>
            `;
        }
        resultGrid.innerHTML = html;
        renderHistory();
    }

    function renderHistory() {
        historyLog.innerHTML = '';
        state.history.forEach(entry => {
            const span = document.createElement('span');
            span.className = 'entry';
            span.innerHTML = entry.text;
            historyLog.appendChild(span);
        });
        historyLog.scrollTop = historyLog.scrollHeight;
    }

    function renderAll() {
        renderMaps();
        renderStatus();
        renderResults();
        renderHistory();
    }

    // ============================================================
    // 7. Применение действий
    function applyAction(payload) {
        const { action, mapId, team, side, phase, pickOrder, banOrder, sidePickWinner, sidePickChoice, currentTurn, startingTeam } = payload;

        if (action === 'ban') {
            const map = getMapById(mapId);
            if (map) map.status = 'banned';
            state.banOrder = banOrder;
            state.banned.push({ mapId, team, order: banOrder });
            addHistory(`<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> забанила <strong>${map.icon} ${map.name}</strong>`);
        } else if (action === 'pick') {
            const map = getMapById(mapId);
            if (map) map.status = 'picked';
            state.pickOrder = pickOrder;
            state.picked.push({ mapId, team, order: pickOrder, side: side || null });
            addHistory(`<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбрала <strong>${map.icon} ${map.name}</strong>`);
            if (side) {
                const pick = state.picked.find(p => p.mapId === mapId);
                if (pick) pick.side = side;
                addHistory(`<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбрала сторону <strong>${side}</strong> для карты ${map.name}`);
            }
        } else if (action === 'side_pick') {
            state.sidePickWinner = sidePickWinner;
            state.sidePickChoice = sidePickChoice;
            const pick = state.picked.find(p => p.mapId === state.sidePickMapId);
            if (pick) pick.side = state.sidePickChoice;
            addHistory(`<span class="hl-${getTeamClass(state.sidePickWinner)}">${getTeamName(state.sidePickWinner)}</span> выбрала сторону <strong>${state.sidePickChoice}</strong>`);
        } else if (action === 'phase_change') {
            state.phase = phase;
            state.currentTurn = currentTurn || null;
            state.startingTeam = startingTeam || state.startingTeam;
            state.isLocked = false;
            if (state.phase === 'complete') {
                const avail = getAvailableMaps();
                if (avail.length === 1) avail[0].status = 'remaining';
                renderResults();
            }
        } else if (action === 'start_draft') {
            startDraft();
        } else if (action === 'reset') {
            resetDraft();
        }
        renderAll();
    }

    // ============================================================
    // 8. Логика драфта
    function handleMapClick(mapId) {
        if (state.isLocked) return;
        if (state.phase === 'setup' || state.phase === 'complete' || state.phase === 'start_announce') return;
        if (state.phase === 'side_pick1' || state.phase === 'side_pick2') return;
        if (!isConnected) {
            alert('Нет соединения с Firebase');
            return;
        }

        const map = getMapById(mapId);
        if (!map || map.status !== 'available') return;

        const team = state.currentTurn;
        if (!team) return;

        const phase = state.phase;

        if (phase === 'ban1' || phase === 'ban2' || phase === 'ban3' || phase === 'ban4') {
            map.status = 'banned';
            state.banOrder++;
            state.banned.push({ mapId: map.id, team, order: state.banOrder });
            addHistory(`<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> забанила <strong>${map.icon} ${map.name}</strong>`);
            sendAction({ action: 'ban', mapId: map.id, team, banOrder: state.banOrder });
            nextPhase();
            return;
        }

        if (phase === 'pick1' || phase === 'pick2') {
            map.status = 'picked';
            state.pickOrder++;
            const pickNum = state.pickOrder;
            state.picked.push({ mapId: map.id, team, order: pickNum, side: null });
            addHistory(`<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбрала <strong>${map.icon} ${map.name}</strong>`);
            state.sidePickMapId = map.id;
            sendAction({ action: 'pick', mapId: map.id, team, pickOrder: pickNum, side: null });
            nextPhase();
            return;
        }
    }

    function nextPhase() {
        const flow = {
            start_announce: 'ban1',
            ban1: 'ban2',
            ban2: 'pick1',
            pick1: 'side_pick1',
            side_pick1: 'ban3',
            ban3: 'ban4',
            ban4: 'pick2',
            pick2: 'side_pick2',
            side_pick2: 'complete',
        };

        let next = flow[state.phase];

        if (next === 'ban1') state.currentTurn = state.startingTeam;
        else if (next === 'ban2') state.currentTurn = getOpponent(state.startingTeam);
        else if (next === 'pick1') state.currentTurn = state.startingTeam;
        else if (next === 'side_pick1') {
            state.currentTurn = null;
            state.sidePickWinner = getOpponent(state.startingTeam);
            state.sidePickChoice = null;
            state.sidePickMapId = state.picked.find(p => p.order === 1)?.mapId || null;
        } else if (next === 'ban3') state.currentTurn = getOpponent(state.startingTeam);
        else if (next === 'ban4') state.currentTurn = state.startingTeam;
        else if (next === 'pick2') state.currentTurn = getOpponent(state.startingTeam);
        else if (next === 'side_pick2') {
            state.currentTurn = null;
            state.sidePickWinner = state.startingTeam;
            state.sidePickChoice = null;
            state.sidePickMapId = state.picked.find(p => p.order === 2)?.mapId || null;
        } else if (next === 'complete') {
            state.currentTurn = null;
            const avail = getAvailableMaps();
            if (avail.length === 1) {
                avail[0].status = 'remaining';
                addHistory(`<span class="hl-gold">Осталась карта: ${avail[0].icon} ${avail[0].name}</span>`);
            }
        }

        state.phase = next;
        state.isLocked = false;

        sendAction({ action: 'phase_change', phase: next, currentTurn: state.currentTurn, startingTeam: state.startingTeam });

        if (next === 'side_pick1' || next === 'side_pick2') {
            const team = state.sidePickWinner;
            addHistory(`<span class="hl-gold">🎯 Выбор стороны:</span> <span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбирает сторону для карты ${getMapById(state.sidePickMapId)?.name}`);
        }

        if (state.phase === 'complete') renderResults();
        renderAll();

        if (getAvailableMaps().length === 0 && state.phase !== 'complete') state.isLocked = true;
    }

    function startDraft() {
        const nameA = teamAInput.value.trim() || 'Team A';
        const nameB = teamBInput.value.trim() || 'Team B';
        state.teamA = nameA;
        state.teamB = nameB;

        state.maps = MAPS_DATA.map(m => ({ ...m, status: 'available' }));
        state.picked = [];
        state.banned = [];
        state.history = [];
        state.banOrder = 0;
        state.pickOrder = 0;
        state.isLocked = false;
        state.sidePickWinner = null;
        state.sidePickChoice = null;
        state.sidePickMapId = null;

        const starter = Math.random() < 0.5 ? 'A' : 'B';
        state.startingTeam = starter;
        state.phase = 'start_announce';
        state.currentTurn = null;

        addHistory(`<span class="hl-gold">🎲 Жеребьёвка:</span> <span class="hl-${getTeamClass(starter)}">${getTeamName(starter)}</span> начинает драфт`);
        sendAction({ action: 'start_draft' });
        renderAll();

        setTimeout(() => {
            state.phase = 'ban1';
            state.currentTurn = state.startingTeam;
            renderAll();
            addHistory(`<span class="hl-${getTeamClass(state.startingTeam)}">${getTeamName(state.startingTeam)}</span> начинает бан`);
            sendAction({ action: 'phase_change', phase: 'ban1', currentTurn: state.currentTurn, startingTeam: state.startingTeam });
        }, 600);
    }

    function resetDraft() {
        state.phase = 'setup';
        state.startingTeam = null;
        state.currentTurn = null;
        state.sidePickWinner = null;
        state.sidePickChoice = null;
        state.sidePickMapId = null;
        state.maps = MAPS_DATA.map(m => ({ ...m, status: 'available' }));
        state.picked = [];
        state.banned = [];
        state.history = [];
        state.banOrder = 0;
        state.pickOrder = 0;
        state.isLocked = false;
        resultsDiv.classList.remove('visible');
        sidePickContainer.classList.add('hidden');
        renderAll();
        btnStart.disabled = !(isConnected && state.phase === 'setup');
        sendAction({ action: 'reset' });
    }

    // ============================================================
    // 9. Обработчики UI
    document.querySelectorAll('.btn-side').forEach(btn => {
        btn.addEventListener('click', () => {
            if (state.phase !== 'side_pick1' && state.phase !== 'side_pick2') return;
            if (state.sidePickChoice) return;
            if (state.isLocked) return;
            if (!isConnected) {
                alert('Нет соединения с Firebase');
                return;
            }
            const side = btn.dataset.side;
            const team = state.sidePickWinner;
            if (!team) return;
            state.sidePickChoice = side;
            state.isLocked = true;

            const pick = state.picked.find(p => p.mapId === state.sidePickMapId);
            if (pick) pick.side = side;

            addHistory(`<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбрала сторону <strong>${side}</strong> для карты ${getMapById(state.sidePickMapId)?.name}`);
            sendAction({ action: 'side_pick', sidePickWinner: team, sidePickChoice: side, mapId: state.sidePickMapId });
            renderStatus();
            setTimeout(() => { state.isLocked = false; nextPhase(); }, 400);
        });
    });

    btnStart.addEventListener('click', () => {
        if (state.phase === 'setup' && isConnected) {
            startDraft();
            btnStart.disabled = true;
        }
    });

    btnReset.addEventListener('click', resetDraft);
    btnReconnect.addEventListener('click', () => location.reload());

    teamAInput.addEventListener('input', () => { state.teamA = teamAInput.value.trim() || 'Team A'; });
    teamBInput.addEventListener('input', () => { state.teamB = teamBInput.value.trim() || 'Team B'; });

    // ============================================================
    // 10. Инициализация
    loadStateFromFirebase();
    resetDraft();

    console.log('🔫 CS2 Draft BO3 — Firebase версия, исправленная');
    console.log('Статус должен стать "Синхронизировано" через пару секунд.');
</script>
</body>
</html>
