<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 Draft — ручное соединение (debug)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* стили такие же, как в прошлом ответе — не меняю их для краткости */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0d10;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2a 0%, #0b0d10 70%);
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 22, 30, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 32px 36px 40px;
            border: 1px solid rgba(255, 180, 50, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        .title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7c948, #f0a020);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #8a92a8; font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
        .phase-badge {
            display: inline-block;
            background: rgba(247, 201, 72, 0.12);
            color: #f7c948;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(247, 201, 72, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header-left { display: flex; flex-direction: column; gap: 4px; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .team-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .team-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .team-input-group:focus-within { border-color: rgba(247, 201, 72, 0.3); }
        .team-input-group .label { font-weight: 600; font-size: 13px; color: #8a92a8; letter-spacing: 0.5px; }
        .team-input-group .label.a { color: #ff6b6b; }
        .team-input-group .label.b { color: #4ecdc4; }
        .team-input-group input {
            background: transparent;
            border: none;
            color: #e8ecf5;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 4px;
            width: 110px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .btn {
            background: linear-gradient(135deg, #f7c948, #e8a020);
            border: none;
            color: #0b0d10;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 20px rgba(247, 201, 72, 0.2);
            white-space: nowrap;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(247, 201, 72, 0.35); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8a92a8;
            font-weight: 500;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #e8ecf5; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 14px 22px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .status-turn {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #e8ecf5;
        }
        .status-turn .team-indicator {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
        }
        .team-indicator.a { background: rgba(255, 107, 107, 0.18); color: #ff6b6b; }
        .team-indicator.b { background: rgba(78, 205, 196, 0.18); color: #4ecdc4; }
        .status-action { color: #aab2c8; font-size: 14px; font-weight: 500; }
        .peer-section {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .peer-section .label { color: #8a92a8; font-size: 13px; font-weight: 500; }
        .peer-section textarea {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e8ecf5;
            padding: 8px 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 12px;
            outline: none;
            width: 100%;
            max-width: 400px;
            min-height: 60px;
            resize: vertical;
        }
        .peer-section textarea:focus { border-color: #f7c948; }
        .peer-status { font-size: 13px; color: #f7c948; font-weight: 500; }
        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .map-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px 10px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            user-select: none;
        }
        .map-card:hover:not(.banned):not(.picked):not(.disabled) {
            border-color: rgba(247, 201, 72, 0.25);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
        }
        .map-card .map-icon { font-size: 34px; display: block; margin-bottom: 6px; }
        .map-card .map-name { font-weight: 600; font-size: 14px; color: #e8ecf5; }
        .map-card .map-status {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
        }
        .map-card .map-status.available { color: #5a6a8a; background: rgba(255,255,255,0.03); }
        .map-card .map-status.banned { color: #ff6b6b; background: rgba(255,107,107,0.12); }
        .map-card .map-status.picked { color: #4ecdc4; background: rgba(78,205,196,0.12); }
        .map-card .map-status.remaining { color: #f7c948; background: rgba(247,201,72,0.15); }
        .map-card.banned { opacity: 0.4; cursor: not-allowed; border-color: rgba(255,107,107,0.1); }
        .map-card.picked { opacity: 0.7; cursor: not-allowed; }
        .map-card.disabled { cursor: not-allowed; opacity: 0.5; }
        .map-card.clickable { cursor: pointer; }
        .map-card .pick-order {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f7c948;
            color: #0b0d10;
            font-weight: 700;
            font-size: 11px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-card .pick-order.ct { background: #4ecdc4; }
        .map-card .pick-order.t { background: #ff6b6b; }
        .results {
            margin-top: 16px;
            padding: 22px 28px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            border: 1px solid rgba(247,201,72,0.08);
            display: none;
        }
        .results.visible { display: block; animation: fadeSlide 0.5s ease; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .results .result-title { font-family: 'Orbitron', monospace; font-weight: 700; font-size: 20px; color: #f7c948; margin-bottom: 12px; }
        .results .result-grid { display: flex; flex-wrap: wrap; gap: 20px 40px; }
        .results .result-item { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #e8ecf5; font-weight: 500; }
        .results .result-item .side-label {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            background: rgba(255,255,255,0.06);
            color: #8a92a8;
        }
        .results .result-item .side-label.ct { background: rgba(78,205,196,0.12); color: #4ecdc4; }
        .results .result-item .side-label.t { background: rgba(255,107,107,0.12); color: #ff6b6b; }
        .history {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            max-height: 80px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .history .entry { font-size: 13px; color: #6a728a; }
        .history .entry strong { color: #aab2c8; }
        .history .entry .hl-a { color: #ff6b6b; }
        .history .entry .hl-b { color: #4ecdc4; }
        .history .entry .hl-gold { color: #f7c948; }
        .hidden { display: none !important; }
        .side-pick-widget {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0,0,0,0.3);
            padding: 6px 18px 6px 22px;
            border-radius: 40px;
            border: 1px solid rgba(247,201,72,0.12);
        }
        .side-pick-widget .label { font-size: 13px; font-weight: 500; color: #8a92a8; }
        .side-pick-widget .winner { font-weight: 700; font-size: 14px; color: #f7c948; }
        .side-pick-widget .btn-side {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e8ecf5;
            font-weight: 600;
            font-size: 13px;
            padding: 5px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-pick-widget .btn-side.ct { color: #4ecdc4; }
        .side-pick-widget .btn-side.t { color: #ff6b6b; }
        .side-pick-widget .btn-side.chosen {
            background: rgba(247,201,72,0.15);
            border-color: #f7c948;
            color: #f7c948;
        }
        @media (max-width: 760px) {
            .app { padding: 20px 18px 28px; }
            .header { flex-direction: column; align-items: stretch; }
            .header-right { flex-direction: column; align-items: stretch; }
            .team-inputs { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; justify-content: center; }
            .peer-section { flex-direction: column; align-items: stretch; }
            .peer-section textarea { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <span class="title">⚔️ CS2 DRAFT</span>
                <span class="subtitle">BO3 · Ручное соединение (debug)</span>
            </div>
            <div class="header-right">
                <div class="team-inputs">
                    <div class="team-input-group">
                        <span class="label a">▲ A</span>
                        <input type="text" id="teamAInput" placeholder="Команда А" value="Team A" />
                    </div>
                    <div class="team-input-group">
                        <span class="label b">▼ B</span>
                        <input type="text" id="teamBInput" placeholder="Команда Б" value="Team B" />
                    </div>
                    <button class="btn" id="btnStart" disabled>▶ Начать драфт</button>
                </div>
                <button class="btn-secondary" id="btnReset">⟲ Сброс</button>
            </div>
        </div>

        <!-- Ручное P2P-соединение -->
        <div class="peer-section" id="peerSection">
            <span class="label">🔗 Ручное соединение:</span>
            <span class="peer-status" id="peerStatus">Ожидание</span>
            <button class="btn-secondary" id="btnCreateOffer">📤 Создать Offer</button>
            <textarea id="offerArea" placeholder="Скопируйте Offer сюда..."></textarea>
            <button class="btn-secondary" id="btnAnswer">📥 Ответить</button>
            <button class="btn-secondary" id="btnApplyAnswer" style="display:none;">✅ Применить ответ</button>
            <button class="btn-secondary" id="btnDisconnect" style="display:none;">Отключиться</button>
        </div>

        <!-- STATUS BAR -->
        <div class="status-bar" id="statusBar">
            <div class="status-left">
                <div class="status-turn" id="statusTurn">
                    <span class="phase-badge" id="phaseBadge">⚡ Ожидание</span>
                    <span id="turnDisplay" style="color:#6a728a;font-weight:400;">—</span>
                </div>
                <div class="status-action" id="statusAction">
                    Введите названия команд и нажмите «Начать драфт»
                </div>
            </div>
            <div id="sidePickContainer" class="side-pick-widget hidden">
                <span class="label">🎯 Выбор стороны</span>
                <span class="winner" id="sideWinner">—</span>
                <button class="btn-side ct" data-side="CT">CT</button>
                <button class="btn-side t" data-side="T">T</button>
            </div>
        </div>

        <!-- MAP GRID -->
        <div class="map-grid" id="mapGrid"></div>

        <!-- RESULTS -->
        <div class="results" id="results">
            <div class="result-title">🏆 Результат драфта</div>
            <div class="result-grid" id="resultGrid"></div>
            <div class="history" id="historyLog"></div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        // MAPS
        const MAPS_DATA = [
            { id: 'dust2', name: 'Dust II', icon: '🏜️' },
            { id: 'mirage', name: 'Mirage', icon: '🏗️' },
            { id: 'inferno', name: 'Inferno', icon: '🏛️' },
            { id: 'nuke', name: 'Nuke', icon: '🏭' },
            { id: 'vertigo', name: 'Vertigo', icon: '🗻' },
            { id: 'ancient', name: 'Ancient', icon: '🏺' },
            { id: 'anubis', name: 'Anubis', icon: '🌊' },
        ];

        // STATE
        const state = {
            teamA: 'Team A',
            teamB: 'Team B',
            startingTeam: null,
            currentTurn: null,
            phase: 'setup',
            maps: MAPS_DATA.map(m => ({ ...m, status: 'available' })),
            picked: [],
            banned: [],
            history: [],
            banOrder: 0,
            pickOrder: 0,
            isLocked: false,
            sidePickMapId: null,
            sidePickWinner: null,
            sidePickChoice: null,
        };

        // DOM refs
        const $ = id => document.getElementById(id);
        const teamAInput = $('teamAInput');
        const teamBInput = $('teamBInput');
        const btnStart = $('btnStart');
        const btnReset = $('btnReset');
        const mapGrid = $('mapGrid');
        const phaseBadge = $('phaseBadge');
        const turnDisplay = $('turnDisplay');
        const statusAction = $('statusAction');
        const sidePickContainer = $('sidePickContainer');
        const sideWinner = $('sideWinner');
        const resultsDiv = $('results');
        const resultGrid = $('resultGrid');
        const historyLog = $('historyLog');
        const peerStatus = $('peerStatus');
        const offerArea = $('offerArea');
        const btnCreateOffer = $('btnCreateOffer');
        const btnAnswer = $('btnAnswer');
        const btnApplyAnswer = $('btnApplyAnswer');
        const btnDisconnect = $('btnDisconnect');

        // --------------------------------------------------------------
        // WebRTC без сигнального сервера (ручной обмен SDP)
        let pc = null;
        let dataChannel = null;
        let isInitiator = false;

        function createPeerConnection() {
            if (pc) {
                console.log('PeerConnection уже существует');
                return;
            }
            console.log('Создаём RTCPeerConnection...');
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };
            try {
                pc = new RTCPeerConnection(config);
                console.log('RTCPeerConnection создан');
            } catch (e) {
                console.error('Ошибка создания RTCPeerConnection:', e);
                alert('Ваш браузер не поддерживает WebRTC');
                return;
            }

            pc.onicecandidate = event => {
                if (event.candidate) {
                    console.log('ICE кандидат:', event.candidate.candidate);
                } else {
                    console.log('ICE сбор завершён');
                }
            };

            pc.onconnectionstatechange = () => {
                console.log('Состояние соединения:', pc.connectionState);
                if (pc.connectionState === 'connected') {
                    peerStatus.textContent = '✅ Подключено!';
                    peerStatus.style.color = '#4ecdc4';
                    btnStart.disabled = false;
                    btnDisconnect.style.display = 'inline-block';
                    btnCreateOffer.disabled = true;
                    btnAnswer.disabled = true;
                    btnApplyAnswer.style.display = 'none';
                }
            };

            // Создаём канал данных
            try {
                dataChannel = pc.createDataChannel('draft', { reliable: true });
                console.log('DataChannel создан');
            } catch (e) {
                console.error('Ошибка создания DataChannel:', e);
                alert('Ошибка создания канала данных');
                return;
            }

            dataChannel.onopen = () => {
                console.log('DataChannel открыт');
                peerStatus.textContent = '✅ Подключено!';
                peerStatus.style.color = '#4ecdc4';
                btnStart.disabled = false;
                btnDisconnect.style.display = 'inline-block';
                btnCreateOffer.disabled = true;
                btnAnswer.disabled = true;
                btnApplyAnswer.style.display = 'none';
                if (!isInitiator) {
                    sendMessage({ type: 'sync_request' });
                }
            };

            dataChannel.onmessage = event => {
                console.log('Получено сообщение:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    handlePeerMessage(data);
                } catch (e) {
                    console.error('Ошибка парсинга сообщения:', e);
                }
            };

            pc.ondatachannel = event => {
                console.log('Входящий DataChannel');
                dataChannel = event.channel;
                dataChannel.onopen = () => {
                    console.log('DataChannel (входящий) открыт');
                    peerStatus.textContent = '✅ Подключено!';
                    peerStatus.style.color = '#4ecdc4';
                    btnStart.disabled = false;
                    btnDisconnect.style.display = 'inline-block';
                    btnCreateOffer.disabled = true;
                    btnAnswer.disabled = true;
                    btnApplyAnswer.style.display = 'none';
                };
                dataChannel.onmessage = event => {
                    console.log('Получено сообщение (входящий канал):', event.data);
                    try {
                        const data = JSON.parse(event.data);
                        handlePeerMessage(data);
                    } catch (e) {
                        console.error('Ошибка парсинга сообщения:', e);
                    }
                };
            };
        }

        // Создать offer
        btnCreateOffer.addEventListener('click', async () => {
            console.log('Кнопка "Создать Offer" нажата');
            if (pc) {
                console.log('PeerConnection уже существует, отключаем...');
                if (dataChannel) dataChannel.close();
                if (pc) pc.close();
                pc = null;
                dataChannel = null;
            }
            isInitiator = true;
            createPeerConnection();
            if (!pc) {
                alert('Не удалось создать PeerConnection');
                return;
            }
            try {
                console.log('Создаём offer...');
                const offer = await pc.createOffer();
                console.log('Offer создан:', offer);
                await pc.setLocalDescription(offer);
                console.log('LocalDescription установлен');
                // Ждём 2 секунды для сбора кандидатов
                await new Promise(r => setTimeout(r, 2000));
                const sdp = pc.localDescription.sdp;
                if (!sdp) {
                    alert('SDP пустой, попробуйте ещё раз');
                    return;
                }
                offerArea.value = sdp;
                peerStatus.textContent = '📤 Offer создан, отправьте сопернику';
                peerStatus.style.color = '#f7c948';
                btnAnswer.disabled = false;
                btnCreateOffer.disabled = true;
                btnApplyAnswer.style.display = 'none';
                console.log('Offer SDP:', sdp.substring(0, 100) + '...');
            } catch (e) {
                console.error('Ошибка создания offer:', e);
                alert('Ошибка создания offer: ' + e.message);
            }
        });

        // Ответить на offer
        btnAnswer.addEventListener('click', async () => {
            console.log('Кнопка "Ответить" нажата');
            const sdp = offerArea.value.trim();
            if (!sdp) {
                alert('Вставьте Offer от соперника');
                return;
            }
            if (isInitiator) {
                // Мы инициатор, значит это ответ, который нужно применить
                btnApplyAnswer.style.display = 'inline-block';
                btnAnswer.disabled = true;
                console.log('Режим инициатора: показываем кнопку "Применить ответ"');
                return;
            }
            // Мы не инициатор — отвечаем на offer
            if (pc) {
                console.log('PeerConnection уже существует, отключаем...');
                if (dataChannel) dataChannel.close();
                if (pc) pc.close();
                pc = null;
                dataChannel = null;
            }
            isInitiator = false;
            createPeerConnection();
            if (!pc) {
                alert('Не удалось создать PeerConnection');
                return;
            }
            try {
                console.log('Устанавливаем remote description (offer)...');
                const offerDesc = new RTCSessionDescription({ type: 'offer', sdp });
                await pc.setRemoteDescription(offerDesc);
                console.log('RemoteDescription установлен');
                const answer = await pc.createAnswer();
                console.log('Answer создан:', answer);
                await pc.setLocalDescription(answer);
                console.log('LocalDescription (answer) установлен');
                await new Promise(r => setTimeout(r, 2000));
                const answerSdp = pc.localDescription.sdp;
                if (!answerSdp) {
                    alert('SDP ответа пустой, попробуйте ещё раз');
                    return;
                }
                offerArea.value = answerSdp;
                peerStatus.textContent = '📥 Ответ создан, отправьте его сопернику';
                peerStatus.style.color = '#f7c948';
                btnAnswer.disabled = true;
                btnCreateOffer.disabled = true;
                console.log('Ответ SDP:', answerSdp.substring(0, 100) + '...');
            } catch (e) {
                console.error('Ошибка создания ответа:', e);
                alert('Ошибка создания ответа: ' + e.message);
            }
        });

        // Применить ответ (для инициатора)
        btnApplyAnswer.addEventListener('click', async () => {
            console.log('Кнопка "Применить ответ" нажата');
            const sdp = offerArea.value.trim();
            if (!sdp) {
                alert('Вставьте ответ от соперника');
                return;
            }
            if (!pc) {
                alert('PeerConnection не создан');
                return;
            }
            if (!isInitiator) {
                alert('Только инициатор может применить ответ');
                return;
            }
            try {
                console.log('Устанавливаем remote description (answer)...');
                const answerDesc = new RTCSessionDescription({ type: 'answer', sdp });
                await pc.setRemoteDescription(answerDesc);
                console.log('RemoteDescription (answer) установлен');
                peerStatus.textContent = '🔄 Соединение устанавливается...';
                btnApplyAnswer.style.display = 'none';
                btnAnswer.disabled = true;
            } catch (e) {
                console.error('Ошибка применения ответа:', e);
                alert('Ошибка применения ответа: ' + e.message);
            }
        });

        // Отключиться
        btnDisconnect.addEventListener('click', () => {
            console.log('Отключение...');
            if (dataChannel) dataChannel.close();
            if (pc) pc.close();
            pc = null;
            dataChannel = null;
            peerStatus.textContent = 'Отключено';
            peerStatus.style.color = '#ff6b6b';
            btnDisconnect.style.display = 'none';
            btnStart.disabled = true;
            btnCreateOffer.disabled = false;
            btnAnswer.disabled = false;
            btnApplyAnswer.style.display = 'none';
            isInitiator = false;
        });

        // Функция отправки сообщений через канал
        function sendMessage(msg) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(msg));
                console.log('Отправлено:', msg);
            } else {
                console.warn('Канал не открыт');
            }
        }

        // --------------------------------------------------------------
        // ОБРАБОТЧИКИ СООБЩЕНИЙ (синхронизация)
        function handlePeerMessage(data) {
            console.log('Получено:', data);
            const { type, payload } = data;
            if (type === 'sync_request') {
                sendFullState();
                return;
            }
            if (type === 'full_state') {
                applyFullState(payload);
                return;
            }
            if (type === 'action') {
                applyAction(payload);
                return;
            }
            if (type === 'start_draft') {
                startDraft();
                return;
            }
            if (type === 'reset') {
                resetDraft();
                return;
            }
        }

        function sendFullState() {
            const payload = {
                teamA: state.teamA,
                teamB: state.teamB,
                startingTeam: state.startingTeam,
                currentTurn: state.currentTurn,
                phase: state.phase,
                maps: state.maps,
                picked: state.picked,
                banned: state.banned,
                history: state.history,
                banOrder: state.banOrder,
                pickOrder: state.pickOrder,
                isLocked: state.isLocked,
                sidePickMapId: state.sidePickMapId,
                sidePickWinner: state.sidePickWinner,
                sidePickChoice: state.sidePickChoice,
            };
            sendMessage({ type: 'full_state', payload });
        }

        function applyFullState(payload) {
            Object.assign(state, payload);
            teamAInput.value = state.teamA;
            teamBInput.value = state.teamB;
            renderMaps();
            renderStatus();
            renderResults();
            renderHistory();
            if (state.phase === 'complete') {
                resultsDiv.classList.add('visible');
            } else {
                resultsDiv.classList.remove('visible');
            }
            if (state.phase !== 'setup') {
                btnStart.disabled = true;
            } else {
                btnStart.disabled = !(dataChannel && dataChannel.readyState === 'open');
            }
        }

        function applyAction(payload) {
            const { action, mapId, team, side, phase, pickOrder, banOrder, sidePickWinner, sidePickChoice, currentTurn, startingTeam } = payload;
            if (action === 'ban') {
                const map = getMapById(mapId);
                if (map) map.status = 'banned';
                state.banOrder = banOrder;
                state.banned.push({ mapId, team, order: banOrder });
                addHistory(
                    `<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> забанила <strong>${map.icon} ${map.name}</strong>`
                    );
            } else if (action === 'pick') {
                const map = getMapById(mapId);
                if (map) map.status = 'picked';
                state.pickOrder = pickOrder;
                state.picked.push({ mapId, team, order: pickOrder, side: side || null });
                addHistory(
                    `<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбрала <strong>${map.icon} ${map.name}</strong>`
                    );
                if (side) {
                    const pick = state.picked.find(p => p.mapId === mapId);
                    if (pick) pick.side = side;
                    addHistory(
                        `<span class="hl-${getTeamClass(team)}">${getTeamName(team)}</span> выбрала сторону <strong>${side}</strong> для карты ${map.name}`
                        );
                }
            } else if (action === 'side_pick') {
                state.sidePickWinner = sidePickWinner;
                state.sidePickChoice = sidePickChoice;
                const pick = state.picked.find(p => p.mapId === state.sidePickMapId);
                if (pick) pick.side = state.sidePickChoice;
                addHistory(
                    `<span class="hl-${getTeamClass(state.sidePickWinner)}">${getTeamName(state.sidePickWinner)}</span> выбрала сторону <strong>${state.sidePickChoice}</strong>`
                    );
            } else if (action === 'phase_change') {
                state.phase = phase;
                state.currentTurn = currentTurn || null;
                state.startingTeam = startingTeam || state.startingTeam;
                state.isLocked = false;
                if (state.phase === 'complete') {
                    const avail = getAvailableMaps();
                    if (avail.length === 1) avail[0].status = 'remaining';
                    renderResults();
                }
            }
            renderMaps();
            renderStatus();
            renderResults();
            renderHistory();
        }

        // --------------------------------------------------------------
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        function getTeamName(team) { return team === 'A' ? state.teamA : state.teamB; }
        function getTeamClass(team) { return team === 'A' ? 'a' : 'b'; }
        function getTeamColor(team) { return team === 'A' ? '#ff6b6b' : '#4ecdc4'; }
        function getOpponent(team) { return team === 'A' ? 'B' : 'A'; }
        function getAvailableMaps() { return state.maps.filter(m => m.status === 'available'); }
        function getMapById(id) { return state.maps.find(m => m.id === id); }
        function getPickedMap(order) { return state.picked.find(p => p.order === order); }
        function getRemainingMap() { const avail = getAvailableMaps(); return avail.length === 1 ? avail[0] : null; }
        function addHistory(text) { state.history.push({ text }); renderHistory(); }

        // --------------------------------------------------------------
        // ОТРИСОВКА (сокращённо, так как она уже была)
        function renderMaps() {
            // ... (код не меняется, оставлю как в прошлый раз)
            // Для краткости пропущу, но в реальном файле он должен быть.
        }
        function renderStatus() { /* ... */ }
        function renderResults() { /* ... */ }
        function renderHistory() { /* ... */ }

        // --------------------------------------------------------------
        // ЛОГИКА ДРАФТА (такая же)
        function handleMapClick(mapId) { /* ... */ }
        function nextPhase() { /* ... */ }
        // ... и остальные функции
        // Я не копирую их сюда, чтобы не раздувать ответ, но в финальном файле они должны быть.

        // --------------------------------------------------------------
        // КНОПКИ СТАРТ / СБРОС
        btnStart.addEventListener('click', () => { /* ... */ });
        btnReset.addEventListener('click', resetDraft);

        // --------------------------------------------------------------
        // ИНИЦИАЛИЗАЦИЯ
        resetDraft();
        peerStatus.textContent = 'Готов к ручному подключению';
        console.log('🔫 CS2 Draft BO3 — debug версия');
        console.log('Если offer не создаётся, проверьте консоль (F12) на ошибки.');
    </script>
